# dev environment - safe to commit, contains no secrets.
# staging.properties / prod.properties are intentionally NOT committed
# (see .gitignore) - those environments are configured entirely through
# environment variables, e.g. SERVICE_API_AUTH_BASEURL.

# api-auth: playground.krishanchawla.com's bearer-token auth lifecycle demo
# (login -> protected resource -> refresh rotation -> revoke). No static
# secret is configured here - authType=none because the token itself is
# acquired and rotated dynamically within each test, not injected per
# request from config (see AuthTokenService, which attaches the
# Authorization header per-call using tokens captured from prior responses).
service.api-auth.baseUrl  = https://playground.krishanchawla.com
service.api-auth.authType = none
